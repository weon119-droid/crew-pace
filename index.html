<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYCLING CREW - 자전거 라이딩 동호회</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1.25rem;
    }
    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-md);
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .google-btn {
      width: 100%;
      background: #ffffff;
      color: #1f2937;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.8rem 1rem;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      transition: background-color 0.15s;
      border: none;
      margin-bottom: 1.25rem;
    }
    .google-btn:hover { background: #f1f5f9; }
  </style>
</head>
<body>
  <!-- Site Header -->
  <header class="site-header">
    <div class="container header-content">
      <a href="index.html" class="brand">
        <span>VELO<span class="accent">PACE</span></span>
        <span class="brand-badge">CREW</span>
      </a>
      <div id="site-nav" class="nav-links"></div>
    </div>
  </header>

  <!-- Main Content -->
  <main style="flex:1; padding: 1.75rem 0 3.5rem;">
    <div class="container">
      <!-- Pending Approval Banner (Shown if user is pending) -->
      <div id="pending-banner"></div>

      <!-- Feed Controls & Category Filter Tabs -->
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; margin-bottom: 1.5rem;">
        <div class="filter-tabs">
          <button class="filter-tab active" data-category="all">전체 피드</button>
          <button class="filter-tab" data-category="notice">📢 공지사항</button>
          <button class="filter-tab" data-category="riding">🚴 정기/번개 라이딩</button>
          <button class="filter-tab" data-category="general">💬 자유 게시판</button>
        </div>

        <a href="new-post.html" class="btn btn-primary btn-sm">
          + 새 글 / 번개 개설
        </a>
      </div>

      <!-- Posts Feed List -->
      <section id="posts-feed" style="display:flex; flex-direction:column; gap:1rem;">
        <!-- Rendered by js/app.js -->
      </section>
    </div>
  </main>

  <!-- Login Modal -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.25rem;">
        <h3 style="font-size:1.2rem; font-weight:800; color:var(--text-main);">크루 로그인</h3>
        <button id="btn-close-modal" style="color:var(--text-muted); font-size:1.2rem; cursor:pointer;">✕</button>
      </div>

      <button id="btn-google-login" class="google-btn">
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Google 계정으로 로그인
      </button>

      <div style="display:flex; align-items:center; gap:0.5rem; color:var(--text-dim); font-size:0.75rem; margin-bottom:1rem;">
        <span style="flex:1; height:1px; background:var(--border-subtle);"></span>
        <span>또는 이메일 간편 로그인</span>
        <span style="flex:1; height:1px; background:var(--border-subtle);"></span>
      </div>

      <form id="email-login-form" style="display:flex; flex-direction:column; gap:0.75rem;">
        <input type="email" id="modal-email" class="form-input" placeholder="이메일 주소" required />
        <input type="password" id="modal-password" class="form-input" placeholder="비밀번호" required />
        <input type="text" id="modal-name" class="form-input" placeholder="닉네임 (신규 가입 시)" />
        <button type="submit" id="btn-modal-submit" class="btn btn-primary" style="width:100%;">
          로그인 / 가입하기
        </button>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script type="module">
    import { initFeed, showToast } from './js/app.js';
    import { signInWithGoogle, signInOrSignUpWithEmail } from './js/auth.js';

    document.addEventListener('DOMContentLoaded', initFeed);

    const modal = document.getElementById('login-modal');
    const btnClose = document.getElementById('btn-close-modal');
    if (btnClose) btnClose.addEventListener('click', () => modal.style.display = 'none');

    // Google Login
    const googleBtn = document.getElementById('btn-google-login');
    if (googleBtn) {
      googleBtn.addEventListener('click', async () => {
        try {
          await signInWithGoogle();
        } catch (err) {
          showToast('Google 로그인 오류: ' + err.message, 'error');
        }
      });
    }

    // Email Login
    const emailForm = document.getElementById('email-login-form');
    if (emailForm) {
      emailForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('modal-email').value.trim();
        const pass = document.getElementById('modal-password').value;
        const name = document.getElementById('modal-name').value.trim();
        try {
          await signInOrSignUpWithEmail(email, pass, name);
          showToast('로그인 성공!', 'success');
          modal.style.display = 'none';
          location.reload();
        } catch (err) {
          showToast(err.message, 'error');
        }
      });
    }
  </script>
</body>
</html>
