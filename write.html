<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew Pace - 게시글 / 러닝 모임 등록</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .write-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 2rem;
    }
  </style>
</head>
<body>
  <!-- Global Header -->
  <header class="site-header"></header>

  <main class="main-content">
    <div class="container" style="max-width: 760px;">
      <div style="margin-bottom: 1.25rem;">
        <a href="board.html" class="btn btn-ghost btn-sm" style="padding-left:0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          목록으로 돌아가기
        </a>
      </div>

      <div class="write-card">
        <h1 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 1.5rem; display:flex; align-items:center; gap:0.5rem;">
          ⚡ 새 모임 / 글 작성
        </h1>

        <form id="write-form">
          <div class="form-row" style="margin-bottom: 1.25rem;">
            <div class="form-group" style="margin-bottom:0;">
              <label class="form-label" for="post-category">카테고리</label>
              <select id="post-category" class="form-select">
                <option value="RUN_SESSION" selected>🏃 정기 / 번개 러닝 세션</option>
                <option value="FREE_TALK">💬 크루 자유 수다 (FREE TALK)</option>
                <option value="NOTICE">📢 공지사항 (운영진 전용)</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom:0; flex: 2;">
              <label class="form-label" for="title">글 제목</label>
              <input type="text" id="title" class="form-input" placeholder="예: [정기러닝] 수요일 한강 반포 7K 530 페이스 팩" required />
            </div>
          </div>

          <!-- Running Session Dynamic Fields -->
          <div id="session-fields" style="background: var(--bg-canvas); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 1.25rem; margin-bottom: 1.25rem;">
            <h3 style="font-size: 0.85rem; font-weight: 700; color: var(--accent-lime); text-transform: uppercase; margin-bottom: 1rem;">
              🏃 러닝 모임 메타데이터 설정
            </h3>

            <div class="form-row" style="margin-bottom: 1rem;">
              <div class="form-group" style="margin-bottom:0;">
                <label class="form-label" for="run-date">러닝 일시 *</label>
                <input type="datetime-local" id="run-date" class="form-input" />
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label class="form-label" for="location">집결 장소 *</label>
                <input type="text" id="location" class="form-input" placeholder="예: 반포한강공원 달빛광장 앞" />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group" style="margin-bottom:0;">
                <label class="form-label" for="target-pace">목표 페이스</label>
                <input type="text" id="target-pace" class="form-input font-mono" placeholder="예: 5:30/km 또는 6'00" value="5:30/km" />
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label class="form-label" for="distance-km">목표 거리 (km)</label>
                <input type="number" id="distance-km" class="form-input font-mono" step="0.1" placeholder="예: 7.5" value="7.0" />
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label class="form-label" for="max-participants">모집 정원 (명)</label>
                <input type="number" id="max-participants" class="form-input font-mono" value="15" min="2" max="100" />
              </div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="content">상세 내용</label>
            <textarea id="content" class="form-textarea" placeholder="코스 안내, 짐 보관 방법, 스트레칭 시간 및 준비물 등을 자유롭게 적어주세요." required></textarea>
          </div>

          <div style="display:flex; justify-content:flex-end; gap: 0.75rem; margin-top: 1.5rem;">
            <a href="board.html" class="btn btn-secondary">취소</a>
            <button type="submit" id="btn-submit" class="btn btn-primary">
              게시글 등록하기
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>

  <script type="module" src="js/write.js"></script>
</body>
</html>
