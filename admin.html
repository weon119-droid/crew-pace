<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew Pace - 운영진 관리 콘솔</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .stat-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .stat-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .stat-value {
      font-size: 1.75rem;
      font-weight: 900;
      color: var(--text-primary);
    }
  </style>
</head>
<body>
  <!-- Global Header -->
  <header class="site-header"></header>

  <main class="main-content">
    <div class="container">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.5rem;">
        <div>
          <h1 style="font-size: 1.5rem; font-weight: 800; display:flex; align-items:center; gap:0.5rem;">
            ⚙️ 크루원 승인 및 관리자 콘솔
          </h1>
          <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem;">
            신규 가입자 승인, 크루 배번 발급, 회원 권한을 제어합니다.
          </p>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="stat-cards">
        <div class="stat-card">
          <span class="stat-label">전체 계정</span>
          <span id="stat-total" class="stat-value font-mono">-</span>
        </div>
        <div class="stat-card" style="border-left: 3px solid #eab308;">
          <span class="stat-label" style="color: #fde047;">승인 대기자 (PENDING)</span>
          <span id="stat-pending" class="stat-value font-mono" style="color: #fde047;">-</span>
        </div>
        <div class="stat-card" style="border-left: 3px solid var(--accent-lime);">
          <span class="stat-label" style="color: var(--accent-lime);">정규 크루원 (MEMBER)</span>
          <span id="stat-member" class="stat-value font-mono" style="color: var(--accent-lime);">-</span>
        </div>
        <div class="stat-card" style="border-left: 3px solid #fb923c;">
          <span class="stat-label" style="color: #fb923c);">운영진 (ADMIN)</span>
          <span id="stat-admin" class="stat-value font-mono" style="color: #fb923c;">-</span>
        </div>
      </div>

      <!-- Users Table -->
      <div class="table-wrapper">
        <table class="data-table">
          <thead>
            <tr>
              <th>크루원 / 이메일</th>
              <th>배번 (BIB)</th>
              <th>역할 (Role)</th>
              <th>가입 상태 (Status)</th>
              <th>가입일</th>
              <th>권한 및 승인 액션</th>
            </tr>
          </thead>
          <tbody id="user-table-body">
            <!-- Rendered by js/admin.js -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
