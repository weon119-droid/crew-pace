<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crew Pace - 게시글 상세</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .post-detail-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 1.75rem 2rem;
      margin-bottom: 2rem;
    }
    .comment-box {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-subtle);
    }
  </style>
</head>
<body>
  <!-- Global Header -->
  <header class="site-header"></header>

  <main class="main-content">
    <div class="container" style="max-width: 820px;">
      <!-- Navigation Bar -->
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.25rem;">
        <a href="board.html" class="btn btn-ghost btn-sm" style="padding-left:0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          피드로 돌아가기
        </a>
        <div id="post-owner-actions"></div>
      </div>

      <!-- Post Main Content -->
      <article class="post-detail-card">
        <div id="post-header"></div>
        <div id="post-session-box" style="display:none;"></div>
        <div id="post-body" style="margin-top: 1.5rem;"></div>

        <!-- Comments Section -->
        <section class="comment-box">
          <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 1rem; display:flex; align-items:center; gap:0.4rem;">
            💬 댓글 <span id="comments-count" class="font-mono" style="color:var(--accent-lime); font-size:0.9rem;">0</span>
          </h3>

          <form id="comment-form" style="margin-bottom: 1.5rem;">
            <div style="display:flex; gap: 0.5rem;">
              <input type="text" id="comment-input" class="form-input" placeholder="러닝 참여 관련 질문이나 응원의 댓글을 남겨주세요." style="flex:1;" required />
              <button type="submit" class="btn btn-secondary">작성</button>
            </div>
          </form>

          <div id="comments-list"></div>
        </section>
      </article>
    </div>
  </main>

  <div id="toast-container"></div>

  <script type="module" src="js/post.js"></script>
</body>
</html>
